<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SSSVV Pure Code Loader</title>
  <style>
    /* Reset & Layout */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    #loader-wrapper {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: #ffffff;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      transition: opacity 0.6s ease, visibility 0.6s ease;
    }

    .loader-container {
      display: flex;
      align-items: center;
      gap: 24px;
    }

    /* SVG Lotus Petals Animation */
    .lotus-svg {
      width: 120px;
      height: 120px;
      overflow: visible;
    }

    .petal-layer {
      transform-origin: center;
      animation: pulsePetals 3s ease-in-out infinite alternate;
    }

    /* Staggered pulse timing for organic blooming effect */
    .layer-outer  { animation-delay: 0.0s; fill: #29b6f6; }
    .layer-mid-2  { animation-delay: 0.2s; fill: #f48fb1; }
    .layer-mid-1  { animation-delay: 0.4s; fill: #ffee58; }
    .layer-inner  { animation-delay: 0.6s; fill: #ce93d8; }

    @keyframes pulsePetals {
      0% {
        transform: scale(0.92) rotate(0deg);
      }
      100% {
        transform: scale(1.08) rotate(15deg);
      }
    }

    /* Typography Styling */
    .brand-text {
      display: flex;
      flex-direction: column;
      font-family: 'Segoe UI', Arial, sans-serif;
      color: #1a237e;
    }

    .sub-title {
      font-size: 1.1rem;
      font-weight: 500;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .main-title {
      font-size: 2.2rem;
      font-weight: 800;
      letter-spacing: 1px;
      line-height: 1.1;
      text-transform: uppercase;
    }

    /* Status & Countdown */
    .status-container {
      margin-top: 30px;
      text-align: center;
      font-family: Arial, sans-serif;
      color: #1a237e;
    }

    .status-text {
      font-size: 1rem;
      font-weight: 600;
    }

    .countdown-text {
      font-size: 0.85rem;
      color: #666;
      margin-top: 4px;
    }

    /* Fade-Out Class */
    #loader-wrapper.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <!-- Pure Code Loading Overlay -->
  <div id="loader-wrapper">
    <div class="loader-container">
      
      <!-- Vector Lotus Flower -->
      <svg class="lotus-svg" viewBox="0 0 200 200">
        <!-- Outer Blue Layer -->
        <g class="petal-layer layer-outer">
          <path d="M100,10 C120,50 150,50 190,100 C150,150 120,150 100,190 C80,150 50,150 10,100 C50,50 80,50 100,10 Z"/>
          <path d="M100,10 C120,50 150,50 190,100 C150,150 120,150 100,190 C80,150 50,150 10,100 C50,50 80,50 100,10 Z" transform="rotate(45 100 100)"/>
        </g>
        <!-- Pink Layer -->
        <g class="petal-layer layer-mid-2">
          <path d="M100,30 C115,65 135,65 170,100 C135,135 115,135 100,170 C85,135 65,135 30,100 C65,65 85,65 100,30 Z"/>
          <path d="M100,30 C115,65 135,65 170,100 C135,135 115,135 100,170 C85,135 65,135 30,100 C65,65 85,65 100,30 Z" transform="rotate(45 100 100)"/>
        </g>
        <!-- Yellow Layer -->
        <g class="petal-layer layer-mid-1">
          <path d="M100,50 C110,75 125,75 150,100 C125,125 110,125 100,150 C90,125 75,125 50,100 C75,75 90,75 100,50 Z"/>
          <path d="M100,50 C110,75 125,75 150,100 C125,125 110,125 100,150 C90,125 75,125 50,100 C75,75 90,75 100,50 Z" transform="rotate(45 100 100)"/>
        </g>
        <!-- Inner Purple Layer -->
        <g class="petal-layer layer-inner">
          <circle cx="100" cy="100" r="30"/>
        </g>
      </svg>

      <!-- Stationary Brand Text -->
      <div class="brand-text">
        <span class="sub-title">Sri Sathya Sai</span>
        <span class="main-title">Vidya Vahini</span>
      </div>

    </div>

    <!-- Status Indicator -->
    <div class="status-container">
      <p class="status-text">Loading application...</p>
      <p class="countdown-text"><span id="timer">10</span> seconds remaining</p>
    </div>
  </div>

  <!-- JavaScript Timer Control -->
  <script>
    window.addEventListener('load', () => {
      const loader = document.getElementById('loader-wrapper');
      const timerDisplay = document.getElementById('timer');
      let timeLeft = 10;

      const countdown = setInterval(() => {
        timeLeft--;
        if (timerDisplay) timerDisplay.textContent = timeLeft;

        if (timeLeft <= 0) {
          clearInterval(countdown);
          loader.classList.add('hidden');
        }
      }, 1000);
    });
  </script>
</body>
</html>
